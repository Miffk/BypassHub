name: BypassHub build

on:
  push:
    branches: ["**"]
    paths: ["BypassHub/**", ".github/workflows/bypasshub.yml"]
    tags: ["bypasshub-v*"]
  pull_request:
    paths: ["BypassHub/**", ".github/workflows/bypasshub.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Опубликовать релиз этой версии (например 1.1.0). Пусто — только собрать exe"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: BypassHub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller pytest

      - name: Tests
        run: python -m pytest -q

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed --uac-admin
          --name BypassHub --icon assets/icon.ico
          --add-data "assets;assets" --collect-data customtkinter
          --hidden-import pystray._win32
          main.py

      - uses: actions/upload-artifact@v4
        with:
          name: BypassHub-windows
          path: BypassHub/dist/BypassHub.exe

      - name: Check release version
        if: inputs.release != ''
        shell: bash
        run: |
          code=$(python -c "import bypasshub; print(bypasshub.__version__)")
          if [ "$code" != "${{ inputs.release }}" ]; then
            echo "::error::Версия в bypasshub/__init__.py ($code) не совпадает с ${{ inputs.release }}"
            exit 1
          fi

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/bypasshub-v') || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release != '' && format('bypasshub-v{0}', inputs.release) || github.ref_name }}
          name: BypassHub ${{ inputs.release != '' && inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: BypassHub/dist/BypassHub.exe
          body: |
            Скачайте **BypassHub.exe** ниже и запустите его (нужны права администратора).
            При первом запуске программа сама скачает zapret и tg-ws-proxy.

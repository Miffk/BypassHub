name: BypassHub build

on:
  push:
    branches: ["**"]
    paths: ["BypassHub/**", "Android/**", "iOS/**", ".github/workflows/bypasshub.yml"]
    tags: ["bypasshub-v*"]
  pull_request:
    paths: ["BypassHub/**", "Android/**", "iOS/**", ".github/workflows/bypasshub.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Опубликовать релиз этой версии (например 1.1.0). Пусто — только собрать exe и apk"
        required: false
        default: ""

permissions:
  contents: write

env:
  # Ядро Android-версии: та же версия sing-box и те же возможности, что у Windows-версии
  SINGBOX_VERSION: "1.14.3"
  CORE_TAGS: "with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0"

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: BypassHub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller pytest

      - name: Tests
        run: python -m pytest -q

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed --uac-admin
          --name BypassHub --icon assets/icon.ico
          --add-data "assets;assets" --collect-data customtkinter --collect-data certifi
          --hidden-import pystray._win32
          main.py

      - name: Smoke test exe
        shell: pwsh
        run: |
          # собранный exe запускается и открывает окно Qt (а не запасное старое)
          $data = Join-Path $env:RUNNER_TEMP "bh-data"
          $p = Start-Process dist\BypassHub.exe -ArgumentList "--data-dir", $data, "--minimized" -PassThru
          Start-Sleep -Seconds 25
          $logFile = Join-Path $data "logs\bypasshub.log"
          $log = if (Test-Path $logFile) { Get-Content $logFile -Raw -Encoding utf8 } else { "" }
          Write-Output $log
          taskkill /T /F /PID $p.Id | Out-Null
          $global:LASTEXITCODE = 0
          if ($log -notmatch "Qt 6\.") {
            Write-Output "::error::Окно Qt не запустилось в собранном exe"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: BypassHub-windows
          path: BypassHub/dist/BypassHub.exe

      - name: Check release version
        if: inputs.release != ''
        shell: bash
        run: |
          code=$(python -c "import bypasshub; print(bypasshub.__version__)")
          if [ "$code" != "${{ inputs.release }}" ]; then
            echo "::error::Версия в bypasshub/__init__.py ($code) не совпадает с ${{ inputs.release }}"
            exit 1
          fi

  # Linux (делалось под CachyOS): один файл BypassHub-linux-x86_64. Собирается на Ubuntu 22.04 —
  # со старой glibc, чтобы запускаться и на свежих дистрибутивах.
  linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: BypassHub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version-file: Android/core/go.mod
          cache-dependency-path: Android/core/go.sum

      - name: Build AmneziaWG engine (bypasshub-awg)
        working-directory: Android/core
        run: |
          CGO_ENABLED=0 go build -tags "$CORE_TAGS" -trimpath -buildvcs=false \
            -ldflags "-s -w -buildid= -checklinkname=0" -o ../../BypassHub/bypasshub-awg ./cmd/bypasshub-awg

      - name: System libraries (Qt, Tk)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libtk8.6 nftables

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller pytest

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
          BYPASSHUB_AWG_BIN: ${{ github.workspace }}/BypassHub/bypasshub-awg
        run: python -m pytest -q

      - name: Build
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed
          --name BypassHub-linux-x86_64
          --add-data "assets:assets" --add-binary "bypasshub-awg:bin"
          --collect-data customtkinter --collect-data certifi
          --collect-submodules httpx --collect-submodules httpcore --collect-submodules anyio
          --collect-submodules h2
          main.py

      - name: Smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # собранный файл запускается и открывает окно Qt; помощник для root отвечает
          data="$RUNNER_TEMP/bh-data"
          ./dist/BypassHub-linux-x86_64 --data-dir "$data" --minimized &
          pid=$!
          sleep 25
          log=$(cat "$data/logs/bypasshub.log" 2>/dev/null || true)
          echo "$log"
          kill $pid 2>/dev/null || true
          if ! echo "$log" | grep -q "Qt 6\."; then
            echo "::error::Окно Qt не запустилось в собранной программе"
            exit 1
          fi
          reply=$(printf '{"id":1,"cmd":"ping","args":{}}\n' | sudo ./dist/BypassHub-linux-x86_64 --root-helper "$data" | tail -n 1)
          echo "$reply"
          echo "$reply" | grep -q pong || { echo "::error::Помощник с правами root не отвечает"; exit 1; }
          # tg-ws-proxy: исходники релиза скачаны при запуске, прокси без окна открывает порт
          src="$data/tgwsproxy/src"
          test -f "$src/proxy/tg_ws_proxy.py" || { echo "::error::Исходники tg-ws-proxy не скачались"; exit 1; }
          ./dist/BypassHub-linux-x86_64 --run-tg-proxy "$src" -- --port 14443 --secret 0123456789abcdef0123456789abcdef \
            --log-file "$RUNNER_TEMP/tg.log" &
          tg=$!
          ok=1
          for i in $(seq 1 40); do
            if (exec 3<>/dev/tcp/127.0.0.1/14443) 2>/dev/null; then ok=0; break; fi
            sleep 0.5
          done
          kill $tg 2>/dev/null || true
          cat "$RUNNER_TEMP/tg.log" || true
          [ $ok -eq 0 ] || { echo "::error::tg-ws-proxy не открыл порт"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: BypassHub-linux
          path: BypassHub/dist/BypassHub-linux-x86_64

  android:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v5
        with:
          go-version-file: Android/core/go.mod
          cache-dependency-path: Android/core/go.sum

      - uses: gradle/actions/setup-gradle@v4

      - name: Core tests
        working-directory: Android/core
        run: go test -tags "$CORE_TAGS" -ldflags "-checklinkname=0" ./bhcore/

      - name: Build core (gomobile)
        working-directory: Android/core
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13 github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          mkdir -p ../app/libs
          gomobile bind -v -target android/arm,android/arm64,android/amd64 -androidapi 21 \
            -javapkg=io.github.miffk.bypasshub -tags "$CORE_TAGS" -trimpath -buildvcs=false \
            -ldflags "-s -w -buildid= -checklinkname=0 -X github.com/sagernet/sing-box/constant.Version=$SINGBOX_VERSION" \
            -o ../app/libs/bhcore.aar ./bhcore

      - name: Signing key
        id: sign
        env:
          KEYSTORE: ${{ secrets.BH_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/bypasshub.jks"
            echo "BH_KEYSTORE_FILE=$RUNNER_TEMP/bypasshub.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Нет секрета BH_KEYSTORE_BASE64 — APK подписан временным ключом и в релиз не попадёт (см. Android/README.md)"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: Android
        env:
          BH_KEYSTORE_PASSWORD: ${{ secrets.BH_KEYSTORE_PASSWORD }}
          BH_KEY_ALIAS: ${{ secrets.BH_KEY_ALIAS }}
          BH_KEY_PASSWORD: ${{ secrets.BH_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk BypassHub-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BypassHub-android
          path: Android/BypassHub-android.apk

  # iOS: неподписанный IPA — его подписывают своим сертификатом (ESign, Sideloadly, zsign), см. iOS/README.md.
  # В релиз попадает как BypassHub-ios.ipa — без подписи, её ставят своим сертификатом.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: Android/core/go.mod
          cache-dependency-path: Android/core/go.sum

      - name: Build core (gomobile)
        working-directory: Android/core
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13 github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          gomobile bind -v -target ios -iosversion 15.0 -tags "$CORE_TAGS" -trimpath -buildvcs=false \
            -ldflags "-s -w -buildid= -checklinkname=0 -X github.com/sagernet/sing-box/constant.Version=$SINGBOX_VERSION" \
            -o ../../iOS/Bhcore.xcframework ./bhcore

      - name: Generate Xcode project
        working-directory: iOS
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned IPA
        working-directory: iOS
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' ../BypassHub/bypasshub/__init__.py)
          xcodebuild -project BypassHub.xcodeproj -target BypassHub -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1 || {
            grep -E "error:|ld: " build.log | sort -u | head -n 80
            tail -n 40 build.log
            exit 1
          }
          mkdir -p Payload
          cp -R build/Release-iphoneos/BypassHub.app Payload/
          ls -la Payload/BypassHub.app Payload/BypassHub.app/PlugIns
          zip -qry BypassHub-ios.ipa Payload
          ls -la BypassHub-ios.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: BypassHub-ios
          path: iOS/BypassHub-ios.ipa

  release:
    needs: [windows, linux, android, ios]
    if: startsWith(github.ref, 'refs/tags/bypasshub-v') || inputs.release != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Files
        id: files
        run: |
          files="dist/BypassHub.exe"$'\n'"dist/BypassHub-linux-x86_64"$'\n'"dist/BypassHub-ios.ipa"
          if [ "${{ needs.android.outputs.signed }}" = "true" ]; then
            files="$files"$'\n'"dist/BypassHub-android.apk"
          else
            echo "::warning::APK не подписан ключом релизов — в релиз попадут BypassHub.exe, BypassHub-linux-x86_64 и BypassHub-ios.ipa, без APK"
          fi
          { echo "list<<EOF"; echo "$files"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release != '' && format('bypasshub-v{0}', inputs.release) || github.ref_name }}
          name: BypassHub ${{ inputs.release != '' && inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.files.outputs.list }}
          body: |
            **Windows** — скачайте **BypassHub.exe** ниже и запустите его (нужны права администратора).
            При первом запуске программа сама скачает zapret и tg-ws-proxy.

            **Linux** (CachyOS, Arch, Fedora, Ubuntu и др., x86_64) — скачайте **BypassHub-linux-x86_64**, сделайте
            его исполняемым (`chmod +x BypassHub-linux-x86_64`) и запустите. Права администратора программа попросит
            сама, когда они понадобятся. Подробнее — в [README](https://github.com/Miffk/BypassHub#linux).

            **Android** (телефоны, планшеты, Android TV) — скачайте **BypassHub-android.apk** и установите
            (Android попросит разрешить установку из этого источника).

            **iPhone и iPad** — **BypassHub-ios.ipa** ставится только **со своим сертификатом**: подпишите его
            в ESign, Sideloadly или zsign (не удаляя плагины) и установите. Без сертификата iOS-версию не установить —
            подробнее в [README](https://github.com/Miffk/BypassHub#iphone-и-ipad).

            Windows, Linux и Android обновятся сами; на iPhone новую версию нужно подписать и установить заново
            (серверы и настройки сохранятся).

name: BypassHub build

on:
  push:
    branches: ["**"]
    paths: ["BypassHub/**", ".github/workflows/bypasshub.yml"]
    tags: ["bypasshub-v*"]
  pull_request:
    paths: ["BypassHub/**", ".github/workflows/bypasshub.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: BypassHub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller pytest

      - name: Tests
        run: python -m pytest -q

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed --uac-admin
          --name BypassHub --icon assets/icon.ico
          --add-data "assets;assets" --collect-data customtkinter
          --hidden-import pystray._win32
          main.py

      - uses: actions/upload-artifact@v4
        with:
          name: BypassHub-windows
          path: BypassHub/dist/BypassHub.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/bypasshub-v')
        uses: softprops/action-gh-release@v2
        with:
          files: BypassHub/dist/BypassHub.exe

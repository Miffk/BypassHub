name: UI check (Windows)

# Плавность окна на настоящей Windows: прокрутка, переключение вкладок, снимки окна.
# Ничего не публикует; запускается вручную или при изменении самой проверки.
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths: ["BypassHub/tools/ui_check.py", ".github/workflows/ui-check.yml"]

jobs:
  ui:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: BypassHub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run UI check
        shell: pwsh
        run: |
          foreach ($v in "base", "band4") {
            python tools/ui_check.py $v ui-check
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-check
          path: BypassHub/ui-check

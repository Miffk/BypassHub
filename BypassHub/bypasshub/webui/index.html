<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BypassHub</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="backdrop" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="grain"></div>
</div>

<div class="window">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-badge" id="brand-badge"></div>
      <div class="brand-name">BypassHub</div>
    </div>
    <nav id="nav"></nav>
    <div class="side-spacer"></div>
    <a class="nav-item support" id="support"></a>
    <div class="version" id="version"></div>
  </aside>

  <main class="content" id="content">
    <header class="page-head">
      <div>
        <h1>Главная</h1>
        <p class="summary" id="summary"></p>
      </div>
      <button class="btn" id="check"></button>
    </header>

    <section class="card hero" id="hero">
      <button class="power" id="power" aria-label="Включить или выключить VPN">
        <span class="ring"></span>
        <span class="core"></span>
      </button>
      <div class="hero-body">
        <div class="hero-top">
          <span class="eyebrow">VPN</span>
          <span class="timer" id="timer"></span>
        </div>
        <div class="hero-status" id="hero-status"></div>
        <div class="hero-server" id="hero-server"></div>
        <div class="chips" id="chips"></div>
      </div>
      <div class="spark" id="spark"></div>
    </section>

    <div class="grid">
      <div class="col">
        <section class="card tile" id="tile-zapret"></section>
        <section class="card tile" id="tile-tg"></section>
        <section class="card quick">
          <h2>Быстрые настройки VPN</h2>
          <label class="switch-row"><span>Российское — напрямую</span><input type="checkbox" class="switch" id="q-ru"></label>
          <label class="switch-row"><span>Kill switch: без VPN — без интернета</span><input type="checkbox" class="switch" id="q-ks"></label>
        </section>
      </div>
      <div class="col">
        <section class="card servers">
          <div class="card-head">
            <h2>Серверы</h2>
            <button class="btn small" id="ping"></button>
          </div>
          <div class="server-list" id="servers"></div>
        </section>
        <section class="card conn" id="conn"></section>
      </div>
    </div>

    <div class="grid bottom">
      <section class="card avail">
        <h2>Доступность</h2>
        <div class="avail-row" id="avail"></div>
      </section>
      <section class="card updates" id="updates"></section>
    </div>
  </main>
</div>

<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
